{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Editar Tarea{% else %}Crear Tarea{% endif %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/task_form.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
</head>
<body>

    <div class="container">
        <h1>{% if form.instance.pk %}Editar Tarea{% else %}Crear Tarea{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="title" id="id_title" class="form-control title" value="{{ form.initial.title|default_if_none:'' }}" placeholder="Titulo" required onfocus="this.placeholder=''" onblur="this.placeholder='Titulo'">
            </div>
            <div class="form-group">
                <textarea name="description" id="id_description" class="form-control" rows="8" placeholder="Descripción"onfocus="this.placeholder=''" onblur="this.placeholder='Descripcion'">{{ form.initial.description|default_if_none:'' }}</textarea>
            </div>
            <div class="form-group" onclick="document.getElementById('id_due_date').showPicker()" style="cursor: pointer;">
                <input type="datetime-local" name="due_date" id="id_due_date" class="form-control datetime" placeholder="Fecha de vencimiento" value="{{ form.initial.due_date|date:'Y-m-d\\TH:i' }}">
            </div>
            <div class="btn-container">
                <a href="{% url 'home' %}"><button type="button" class="btn-action cancel">Cancelar</button></a>
                <a><button type="submit" class="btn-action save">Guardar</button></a>
            </div>
        </form>
    </div>
    
</body>
</html>
