{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.4.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/login_register.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Nombre de usuario" required onfocus="this.placeholder=''" onblur="this.placeholder='Nombre de usuario'">
            </div>
            <div class="form-group">
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Contraseña" required onfocus="this.placeholder=''" onblur="this.placeholder='Contraseña'">
            </div>
            <div class="login-container">
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </div>
            <p class="login-text mt-3 text-center">¿No tienes una cuenta?
                <a class="register-link" href="{% url 'register' %}"> Registrate </a>
            </p>
        </form>
    </div>
    {% if messages %}
    <div class="messages-container">
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="alert alert-{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</body>
</html>
